name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the shared documentation
    runs-on: ubuntu-latest
    env:
      COMPOSER_MAX_PARALLEL_HTTP: 4
    steps:
      - uses: actions/checkout@v6
      - name: Select released source inputs
        id: sources
        run: |
          python tools/check_sources.py --source-root _sources/pdf --github-output "$GITHUB_OUTPUT"
          python tools/html_demo.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: PDFToolkit/pdf
          ref: ${{ steps.sources.outputs.core_revision }}
          fetch-depth: 0
          path: _sources/pdf
      - uses: actions/checkout@v6
        with:
          repository: PDFToolkit/opentype
          ref: ${{ steps.sources.outputs.opentype_revision }}
          fetch-depth: 0
          path: _sources/opentype
      - uses: actions/checkout@v6
        with:
          repository: PDFToolkit/pdf-to-html
          ref: ${{ steps.sources.outputs.pdf_to_html_revision }}
          fetch-depth: 0
          path: _sources/pdf-to-html
      - uses: actions/checkout@v6
        with:
          repository: PDFToolkit/pdf-to-html-demo
          ref: ${{ steps.sources.outputs.demo_revision }}
          fetch-depth: 0
          path: _sources/pdf-to-html-demo
      - uses: actions/checkout@v6
        with:
          repository: PDFToolkit/pdf-codecs
          ref: ${{ steps.sources.outputs.codecs_revision }}
          fetch-depth: 0
          path: _sources/pdf-codecs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, dom, iconv, mbstring, zlib, openssl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install the released packages' locked build inputs
        env:
          CORE_ROOT_VERSION: ${{ steps.sources.outputs.core_alias }}
        run: |
          install_locked_inputs() {
            local directory="$1"
            local log="$RUNNER_TEMP/composer-$(basename "$directory").log"
            local status
            for attempt in 1 2 3; do
              set +e
              composer install --working-dir "$directory" --no-interaction --prefer-dist > "$log" 2>&1
              status=$?
              set -e
              cat "$log"
              if [ "$status" -eq 0 ]; then break; fi
              if ! grep -Eq 'HTTP(/[0-9.]+)?[[:space:]]+(429|502|503|504)([^0-9]|$)' "$log"; then
                return "$status"
              fi
              if [ "$attempt" -eq 3 ]; then return "$status"; fi
              sleep "$((attempt * 5))"
            done
            composer check-platform-reqs --working-dir "$directory"
            composer audit --working-dir "$directory" --locked
          }
          COMPOSER_ROOT_VERSION="$CORE_ROOT_VERSION" install_locked_inputs _sources/pdf
          install_locked_inputs _sources/opentype
          install_locked_inputs _sources/pdf-codecs
          install_locked_inputs _sources/pdf-to-html
      - name: Install the released browser demo's locked inputs
        run: |
          composer install --working-dir _sources/pdf-to-html-demo --no-dev --no-interaction --prefer-dist
          composer check-platform-reqs --working-dir _sources/pdf-to-html-demo --no-dev
          composer audit --working-dir _sources/pdf-to-html-demo --locked --no-dev
          npm ci --ignore-scripts --prefix _sources/pdf-to-html-demo
          npm audit --prefix _sources/pdf-to-html-demo
      - name: Install demo browser validation engines
        working-directory: _sources/pdf-to-html-demo
        run: npx playwright install --with-deps chromium firefox
      - run: python -m pip install --require-hashes -r tools/site-requirements.txt
      - run: python -m pip install --require-hashes -r _sources/pdf/tools/public-key-validation-requirements.txt
      - run: python -m pip install --require-hashes -r _sources/pdf-to-html/tools/validation-requirements.txt
      - run: python -m pip install --require-hashes -r _sources/pdf-to-html/tools/source-integrity-validation-requirements.txt
      - run: python -m pip install --require-hashes -r _sources/pdf-to-html-demo/tools/validation-requirements.txt
      - run: python -m pip install --require-hashes -r _sources/pdf/vendor/pdftoolkit/pdf-images/tools/validation-requirements.txt
      - run: python -m pip install --require-hashes -r _sources/pdf/vendor/pdftoolkit/pdf-fonts/tools/validation-requirements.txt
      - run: python -m pip install --require-hashes -r _sources/opentype/tools/validation-requirements.txt
      - run: python -m pip install --require-hashes -r _sources/pdf-codecs/tools/jpeg-validation-requirements.txt
      - name: Install the selected Reader oracle requirements
        run: |
          reader_consumer=$(python tools/check_sources.py --source-root _sources/pdf --pdf-to-html-root _sources/pdf-to-html --reader-consumer)
          python -m pip install --require-hashes -r "$reader_consumer/vendor/pdftoolkit/pdf-reader/tools/source-mac-validation-requirements.txt"
      - run: python -m pip check
      - uses: ./_sources/pdf/.github/actions/setup-qpdf
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript imagemagick libjbig2dec0 util-linux cmake gcc make ninja-build pkg-config libfreetype-dev libjpeg-dev libpng-dev liblcms2-dev libopenjp2-7-dev zlib1g-dev
      - name: Build the pinned image colour-management oracle
        run: python _sources/pdf/vendor/pdftoolkit/pdf-images/tools/build_poppler.py --output _build/poppler
      - name: Verify documentation build contracts
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify bilingual navigation and search behavior
        run: node tests/site_locales.cjs
      - name: Build real examples and verify every documentation page
        run: python tools/build_docs.py --source-root _sources/pdf --opentype-root _sources/opentype --codecs-root _sources/pdf-codecs --pdf-to-html-root _sources/pdf-to-html --demo-root _sources/pdf-to-html-demo --docs-revision "$GITHUB_SHA" --openssl /usr/bin/openssl --image-pdftoppm "$GITHUB_WORKSPACE/_build/poppler/build/utils/pdftoppm" --remote
      - name: Verify the old project-site compatibility output
        run: |
          python tools/build_legacy_site.py --site-url https://pdftoolkit.github.io/ --site-dir _site --legacy-base /pdf --legacy-manifest resources/legacy-site-manifest.json --output _legacy
          python tools/check_legacy_site.py _legacy
          node tests/legacy_redirect.cjs _legacy
      - name: Verify browser demo on the generated bilingual site
        run: |
          python -m http.server 8080 --bind 127.0.0.1 --directory _site > _build/demo-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/site-manifest.json > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          node _sources/pdf-to-html-demo/tests/browser.cjs --base-url http://127.0.0.1:8080 --output _build/demo-browsers --site
      - name: Retain browser demo validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-demo-evidence
          path: _build/demo-browsers
          if-no-files-found: warn
      - name: Retain package validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-validation-evidence
          path: |
            _build/*validation*.json
            _build/validation-sources.json
            _build/jpx-codec-validation/
            _build/font-layout-validation/report.json
            _build/html-codec-images-browsers/
            _build/openjpeg-oracle/build.json
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish the shared documentation
        id: deployment
        uses: actions/deploy-pages@v4
