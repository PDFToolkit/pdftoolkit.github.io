name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the shared documentation
    runs-on: ubuntu-latest
    env:
      COMPOSER_MAX_PARALLEL_HTTP: 4
    steps:
      - uses: actions/checkout@v6
      - name: Select released source inputs
        id: sources
        run: python tools/check_sources.py --source-root _sources/pdf --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: PDFToolkit/pdf
          ref: ${{ steps.sources.outputs.core_revision }}
          fetch-depth: 0
          path: _sources/pdf
      - uses: actions/checkout@v6
        with:
          repository: PDFToolkit/opentype
          ref: ${{ steps.sources.outputs.opentype_revision }}
          fetch-depth: 0
          path: _sources/opentype
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, zlib, openssl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the released packages' locked build inputs
        env:
          CORE_ROOT_VERSION: ${{ steps.sources.outputs.core_alias }}
        run: |
          install_locked_inputs() {
            local directory="$1"
            local log="$RUNNER_TEMP/composer-$(basename "$directory").log"
            local status
            for attempt in 1 2 3; do
              set +e
              composer install --working-dir "$directory" --no-interaction --prefer-dist > "$log" 2>&1
              status=$?
              set -e
              cat "$log"
              if [ "$status" -eq 0 ]; then break; fi
              if ! grep -Eq 'HTTP(/[0-9.]+)?[[:space:]]+(429|502|503|504)([^0-9]|$)' "$log"; then
                return "$status"
              fi
              if [ "$attempt" -eq 3 ]; then return "$status"; fi
              sleep "$((attempt * 5))"
            done
            composer check-platform-reqs --working-dir "$directory"
            composer audit --working-dir "$directory" --locked
          }
          COMPOSER_ROOT_VERSION="$CORE_ROOT_VERSION" install_locked_inputs _sources/pdf
          install_locked_inputs _sources/opentype
      - run: python -m pip install --require-hashes -r tools/site-requirements.txt
      - run: python -m pip install --require-hashes -r _sources/pdf/tools/public-key-validation-requirements.txt
      - uses: ./_sources/pdf/.github/actions/setup-qpdf
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify bilingual navigation and search behavior
        run: node tests/site_locales.cjs
      - name: Build real examples and verify every documentation page
        run: python tools/build_docs.py --source-root _sources/pdf --opentype-root _sources/opentype --docs-revision "$GITHUB_SHA" --openssl /usr/bin/openssl --remote
      - name: Verify the old project-site compatibility output
        run: |
          python tools/build_legacy_site.py --site-url https://pdftoolkit.github.io/ --site-dir _site --legacy-base /pdf --legacy-manifest resources/legacy-site-manifest.json --output _legacy
          python tools/check_legacy_site.py _legacy
          node tests/legacy_redirect.cjs _legacy
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish the shared documentation
        id: deployment
        uses: actions/deploy-pages@v4
